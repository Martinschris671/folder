<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integrated TikTok Lookup</title>
    <style>
      /* Provided base styles */
      .flex {
        display: flex;
      }
      .items-center {
        align-items: center;
      }
      .justify-between {
        justify-content: space-between;
      }
      .justify-center {
        justify-content: center;
      }
      .px-16 {
        padding-left: 16px;
        padding-right: 16px;
      }
      .mx-8 {
        margin-left: 8px;
        margin-right: 8px;
      }
      .pb-16 {
        padding-bottom: 16px;
      }

      /* Scoped styles for the lookup functionality */
      #lookup_wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      #lookup_input {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      #lookup_input:focus {
        outline: none;
        border-color: #69c9d0;
        box-shadow: 0 0 0 3px rgba(105, 201, 208, 0.2);
      }

      #lookup_profilePreview {
        width: 100%;
        transition: opacity 0.3s ease-out;
        opacity: 1;
      }
      #lookup_profilePreview.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .lookup_contentWrapper,
      .lookup_skeletonContainer {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }
      .hidden {
        display: none !important;
      }

      .lookup_avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        background-color: #eee;
      }
      .lookup_info {
        flex: 1;
        min-width: 0;
      }
      .lookup_nicknameLine {
        display: flex;
        align-items: center;
        gap: 12px; /* 12px gap for verified badge */
      }
      .lookup_nickname {
        font-size: 15px;
        font-weight: 700;
        color: #111;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lookup_handle {
        font-weight: 400;
        color: #555;
        font-size: 14px;
      }
      .lookup_followers {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
      }

      /* Skeleton Animation */
      @keyframes shimmer {
        0% {
          background-position: -468px 0;
        }
        100% {
          background-position: 468px 0;
        }
      }
      .skeleton {
        background-color: #e0e0e0;
        background-image: linear-gradient(
          to right,
          #e0e0e0 0%,
          #f0f0f0 20%,
          #e0e0e0 40%,
          #e0e0e0 100%
        );
        background-repeat: no-repeat;
        background-size: 800px 104px;
        animation: shimmer 1.5s linear infinite;
        border-radius: 4px;
      }
      .skeleton-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .skeleton-text {
        height: 14px;
        margin-bottom: 6px;
      }
      .skeleton-text.short {
        width: 60%;
      }
      .skeleton-text.medium {
        width: 80%;
      }
    </style>
  </head>

</html>
