<!DOCTYPE html>
<html>
  <head>
    <title>Processing Payment</title>
    <link rel="stylesheet" href="loading.css" />
    <style>
      /* General styles from the request */
      * {
        box-sizing: border-box;
      }

      /* Utility classes from the request */
      .justify-center {
        justify-content: center;
      }
      .items-center {
        align-items: center;
      }
      .flex {
        display: flex;
      }
      .box-border {
        box-sizing: border-box;
      }
      .z-5000 {
        z-index: 5000;
      }
      .fixed {
        position: fixed;
      }
      .radius-containerslevel2-small {
        border-radius: 12px;
      }
      .background-color-ToastDefault {
        background-color: var(--ToastDefault, rgba(84, 84, 84, 0.92));
      }
      .p-16 {
        padding: 16px;
      }
      .flex-col {
        flex-direction: column;
      }
      .w-48 {
        width: 48px;
      }
      .h-48 {
        height: 48px;
      }
      .text-center {
        text-align: center;
      }
      .px-8 {
        padding-left: 8px;
        padding-right: 8px;
      }
      .mt-4 {
        margin-top: 4px;
      }

      /* Typography */
      .H4-Bold,
      .H4-Medium,
      .H4-Regular,
      .H4-Semibold {
        font-size: 15px;
        letter-spacing: 0.004em;
        line-height: 1.3em;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
          Cantarell, Noto Sans, sans-serif;
      }
      .H4-Semibold {
        font-weight: 600;
      }
      .text-color-ConstTextInverse {
        color: var(--ConstTextInverse, #fff);
      }
    </style>
  </head>
  <body>
    <div dir="ltr">
      <div
        class="z-5000 box-border fixed flex items-center justify-center"
        style="inset: 0px; visibility: visible"
      >
        <div
          class="background-color-ToastDefault p-16 flex flex-col items-center justify-center radius-containerslevel2-small"
          style="max-width: 70%"
        >
          <div class="w-48 h-48 box-border flex items-center justify-center">
            <svg
              fill="currentColor"
              preserveAspectRatio="none"
              viewBox="0 0 463 276"
              width="25"
              height="15"
            >
              <defs>
                <mask id="tux-loading-red-hole-4">
                  <rect
                    width="100%"
                    height="100%"
                    fill="rgb(255, 255, 255)"
                  ></rect>
                  <circle
                    r="110"
                    cx="352.5"
                    cy="138"
                    stroke-width="0"
                    class="tux-loading__red_animation"
                    fill="rgb(15, 15, 15)"
                  ></circle>
                </mask>
                <mask id="tux-loading-green-hole-4">
                  <rect
                    width="100%"
                    height="100%"
                    fill="rgb(255, 255, 255)"
                  ></rect>
                  <circle
                    r="110"
                    cx="111"
                    cy="138"
                    stroke-width="0"
                    class="tux-loading__green_animation"
                    fill="rgb(15, 15, 15)"
                  ></circle>
                </mask>
              </defs>
              <circle
                r="110"
                cx="352.5"
                cy="138"
                stroke-width="0"
                class="tux-loading__red_animation"
                fill="rgb(15, 15, 15)"
              ></circle>
              <circle
                mask="url(#tux-loading-red-hole-4)"
                r="110"
                cx="111"
                cy="138"
                stroke-width="0"
                class="tux-loading__green_animation"
                fill="rgb(37, 244, 238)"
              ></circle>
              <circle
                mask="url(#tux-loading-green-hole-4)"
                r="110"
                cx="352.5"
                cy="138"
                stroke-width="0"
                class="tux-loading__red_animation"
                fill="rgb(255, 44, 85)"
              ></circle>
            </svg>
          </div>
          <div
            data-test-tag="tux-loadingHUD-text"
            class="H4-Semibold text-color-ConstTextInverse mt-4 text-center px-8"
          >
            Payment processing. Please don’t close this page.
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
