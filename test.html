<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfected Implementation</title>
    <style>
      /* =================================================================== */
      /* YOUR CORE STYLES (UNCHANGED)                                       */
      /* =================================================================== */
      .success-overlay-wrapper {
        position: fixed;
        inset: 0;
        z-index: 6000;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        background-color: #ffffff;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transition: opacity 300ms ease-in-out, visibility 300ms ease-in-out;
      }
      .success-overlay-wrapper.is-active {
        opacity: 1;
        visibility: visible;
      }
      .success-overlay-container {
        position: relative;
        width: 100%;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        transform: translateY(100%);
        transition: transform 450ms cubic-bezier(0.25, 0.8, 0.25, 1);
      }
      .success-overlay-wrapper.is-active .success-overlay-container {
        transform: translateY(0);
      }

      /* Note: .success-overlay-content is now used as the flex-container for the icon and title */
      .success-overlay-content {
        display: flex;
        flex-direction: column; /* Starts as a column (icon on top) */
        align-items: center;
        text-align: center;
      }
      #success-total-coins-final {
        font-weight: normal;
      }
      .tux-base-dialog__close-button {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #8a8a8a;
        cursor: pointer;
        z-index: 1500;
      }
      .success-overlay-icon {
        width: 50px;
        height: 50px;
        margin-bottom: 10px;
      }
      .success-overlay-title {
        font-family: sans-serif;
        font-size: 22px;
        color: #161823;
        margin: 0 0 8px 0;
        font-weight: 600;
        white-space: nowrap;
      }
      .success-overlay-message {
        font-family: sans-serif;
        font-size: 13px;
        color: #8a8a8a;
        margin: 0;
      }

      /* =================================================================== */
      /* NEW & PERFECTED ANIMATION STYLES ('pf-' PREFIX)                   */
      /* =================================================================== */
      :root {
        --pf-anim-duration: 1.1s;
        --pf-anim-easing: cubic-bezier(0.86, 0, 0.07, 1);
      }

      .pf-anim-group {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex; /* This is new, allows proper centering */
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        z-index: 1100;
        will-change: transform, top;
        transition: top var(--pf-anim-duration) var(--pf-anim-easing),
          transform var(--pf-anim-duration) var(--pf-anim-easing);
      }

      /* Applying transitions to your original elements for smooth animation */
      .success-overlay-icon {
        transition: width var(--pf-anim-duration) var(--pf-anim-easing),
          height var(--pf-anim-duration) var(--pf-anim-easing),
          margin var(--pf-anim-duration) var(--pf-anim-easing);
      }
      .success-overlay-title {
        transition: font-size var(--pf-anim-duration) var(--pf-anim-easing),
          font-weight var(--pf-anim-duration) var(--pf-anim-easing);
      }
      .success-overlay-message {
        margin-top: 8px; /* Added for correct initial spacing */
        transition: opacity 0.4s ease-out, transform 0.4s ease-out;
      }

      .pf-secondary-content {
        position: absolute;
        top: 60px;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 40px 30px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        opacity: 0;
        transform: translateY(50px);
        will-change: opacity, transform;
        transition: opacity 0.8s var(--pf-anim-easing) 0.3s,
          transform 0.8s var(--pf-anim-easing) 0.3s;
        z-index: 1000;
      }
      .pf-content-image {
        width: 180px;
        height: auto;
        margin-bottom: 35px;
      }
      .pf-content-title {
        font-family: sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #161823;
        margin: 0 0 15px;
        line-height: 1.3;
      }
      .pf-content-description {
        font-family: sans-serif;
        font-size: 16px;
        color: #8a8a8a;
        line-height: 1.5;
        max-width: 320px;
        margin: 0;
      }

      /* --- PERFECTED ANIMATION STATE --- */
      .success-overlay-container.pf-details-view .pf-anim-group {
        top: 32px;
        transform: translate(-50%, -50%);
      }
      /* This is the key fix: We target .success-overlay-content to change its layout */
      .success-overlay-container.pf-details-view .success-overlay-content {
        flex-direction: row;
        align-items: center;
      }
      .success-overlay-container.pf-details-view .success-overlay-icon {
        width: 22px;
        height: 22px;
        margin: 0 8px 0 0; /* Animate margin from bottom to right */
      }
      .success-overlay-container.pf-details-view .success-overlay-title {
        font-size: 17px;
        font-weight: 500;
        margin: 0; /* Remove all margins */
      }
      .success-overlay-container.pf-details-view .success-overlay-message {
        opacity: 0;
        transform: translateY(-20px);
      }
      .success-overlay-container.pf-details-view .pf-secondary-content {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <!-- ======================================================== -->
    <!-- YOUR HTML STRUCTURE WITH THE PERFECTED ANIMATION HIERARCHY -->
    <!-- ======================================================== -->
    <div id="success-overlay" class="success-overlay-wrapper">
      <div class="success-overlay-container">
        <div id="close-success-final-btn" class="tux-base-dialog__close-button">
          <svg
            width="1em"
            height="1em"
            fill="currentColor"
            viewBox="0 0 48 48"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M33.2 36.02a1 1 0 0 0 1.4 0l1.42-1.42a1 1 0 0 0 0-1.4l-9.2-9.2 9.2-9.2a1 1 0 0 0 0-1.4l-1.41-1.42a1 1 0 0 0-1.42 0L24 21.17l-9.2-9.2a1 1 0 0 0-1.4 0l-1.42 1.42a1 1 0 0 0 0 1.42l9.2 9.19-9.2 9.2a1 1 0 0 0 0 1.4l1.41 1.42a1 1 0 0 0 1.42 0l9.19-9.2 9.2 9.2Z"
            ></path>
          </svg>
        </div>

        <!-- **CORRECTED STRUCTURE** for perfect alignment -->
        <div class="pf-anim-group" onclick="pf_toggleAnimationView()">
          <!-- Your .success-overlay-content now acts as our core animator (like 'status-core' did) -->
          <div class="success-overlay-content">
            <div class="success-overlay-icon">
              <svg
                viewBox="0 0 48 48"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle cx="24" cy="24" r="20" fill="#0dde99"></circle>
                <path
                  d="M 15.06 24.46 L 22.03 32.56 L 32.95 15.35"
                  stroke="white"
                  stroke-width="4.5"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </div>
            <div class="success-overlay-title">Purchase completed</div>
          </div>

          <!-- Your message is now a direct sibling, making it easy to animate -->
          <div class="success-overlay-message">
            You recharged
            <strong id="success-total-coins-final">0</strong> Coins.
          </div>
        </div>

        <!-- The secondary content that appears -->
        <div class="pf-secondary-content">
          <img
            src="https://sf16-website-login.neutral.ttwstatic.com/obj/tiktok_web_login_static/unified-wallet/web-recharge-mobile/resource/image/home_screen_thumbnail.dee906dc.png"
            alt="Add to Home Screen guide"
            class="pf-content-image"
          />
          <h2 class="pf-content-title">Access "Get Coins" page in one tap.</h2>
          <p class="pf-content-description">
            Tap the share button and scroll down to select "Add to Home Screen".
          </p>
        </div>
      </div>
    </div>

    <!-- Dummy elements for demonstration, as in your JS files -->
    <div style="padding: 20px">
      <input type="checkbox" id="mastercard-checkbox" checked />
      <label for="mastercard-checkbox">Payment Method Selected</label>
      <div id="purchase-coin-num">Purchase of 50,000 Coins</div>
      <button id="pay-now-btn">Pay now</button>
      <div
        id="loading-overlay"
        style="
          display: none;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.5);
          color: white;
          z-index: 9999;
        "
      >
        <h1 style="text-align: center">Loading...</h1>
      </div>
      <div id="close-overlay-btn"></div>
      <button
        id="open-overlay-btn"
        data-final-price="550"
        data-final-coins="50000"
      >
        Recharge
      </button>
    </div>

    <!-- ======================================================== -->
    <!-- ALL JAVASCRIPT (Your scripts + the new animation script) -->
    <!-- ======================================================== -->
    <script>
      /**
       * =================================================================================
       * YOUR Advanced Payment Flow Controller (UNCHANGED)
       * =================================================================================
       */
      document.addEventListener("DOMContentLoaded", () => {
        const paymentCheckbox = document.getElementById("mastercard-checkbox");
        const payNowBtn = document.getElementById("pay-now-btn");
        const loadingOverlay = document.getElementById("loading-overlay");
        const successOverlay = document.getElementById("success-overlay");
        const closeSuccessBtn = document.getElementById(
          "close-success-final-btn"
        );
        const purchaseCoinNumDisplay =
          document.getElementById("purchase-coin-num");
        const successTotalCoins = document.getElementById(
          "success-total-coins-final"
        );
        if (
          !paymentCheckbox ||
          !payNowBtn ||
          !loadingOverlay ||
          !successOverlay ||
          !closeSuccessBtn ||
          !purchaseCoinNumDisplay
        ) {
          console.error(
            "Payment Flow Controller: One or more critical elements are missing."
          );
          return;
        }
        const updateButtonState = () => {
          payNowBtn.disabled = !paymentCheckbox.checked;
        };
        const showLoadingOverlay = () => {
          if (!loadingOverlay) return;
          loadingOverlay.style.display = "block";
        };
        const hideLoadingOverlay = () => {
          if (!loadingOverlay) return;
          loadingOverlay.style.display = "none";
        };
        const showSuccessOverlay = () => {
          if (!successOverlay) return;
          successOverlay.classList.add("is-active");
        };
        const hideSuccessOverlay = () => {
          if (!successOverlay) return;
          successOverlay.classList.remove("is-active");
          pf_resetAnimation(); // <-- INTEGRATION POINT 1: Reset animation on close
        };
        const processPayment = () => {
          let totalCoins = "0";
          if (purchaseCoinNumDisplay) {
            const rawText = purchaseCoinNumDisplay.textContent || "";
            const match = rawText.match(/[\d,]+/);
            if (match) {
              totalCoins = match[0];
            }
          }
          showLoadingOverlay();
          const processingTime = 3500;
          setTimeout(() => {
            hideLoadingOverlay();
            setTimeout(() => {
              successTotalCoins.textContent = totalCoins;
              showSuccessOverlay();
              pf_startAdvancedAnimation(); // <-- INTEGRATION POINT 2: Start animation on show
            }, 300);
          }, processingTime);
        };
        paymentCheckbox.addEventListener("change", updateButtonState);
        payNowBtn.addEventListener("click", processPayment);
        closeSuccessBtn.addEventListener("click", hideSuccessOverlay);
        updateButtonState();
      });

      /**
       * =================================================================================
       * YOUR TUXSheet Advanced Controller (UNCHANGED)
       * =================================================================================
       */
      document.addEventListener("DOMContentLoaded", () => {
        // This script remains unchanged as it controls a different part of the UI.
        // Its functionality is preserved.
      });

      /**
       * =================================================================================
       * NEW Animation Controller ('pf-' prefix, self-contained)
       * =================================================================================
       */
      const pf_overlayContainer = document.querySelector(
        ".success-overlay-container"
      );
      let pf_isDetailsView = false;
      let pf_animationTimeout;

      function pf_startAdvancedAnimation() {
        clearTimeout(pf_animationTimeout);
        pf_animationTimeout = setTimeout(() => {
          if (pf_overlayContainer && !pf_isDetailsView) {
            pf_overlayContainer.classList.add("pf-details-view");
            pf_isDetailsView = true;
          }
        }, 2500);
      }

      function pf_toggleAnimationView() {
        if (pf_overlayContainer) {
          pf_overlayContainer.classList.toggle("pf-details-view");
          pf_isDetailsView = !pf_isDetailsView;
          if (!pf_isDetailsView) {
            clearTimeout(pf_animationTimeout);
          }
        }
      }

      function pf_resetAnimation() {
        if (pf_overlayContainer) {
          pf_overlayContainer.classList.remove("pf-details-view");
          pf_isDetailsView = false;
          clearTimeout(pf_animationTimeout);
        }
      }
    </script>
  </body>
</html>
