<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Home | TikTok Coin Tool</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background-color: #f8f8f8;
        display: flex;
        justify-content: center;

      h1 {

        background: white;

      .status {
        color: #28a745;

      #logout-btn {
        margin-top: 20px;

        background-color: #dc3545;

        border-radius: 4px;

    <!-- Load Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SECURITY SCRIPT -->
    <script>
      const AUTH_URL = "index.html";
      const DASHBOARD_URL = "dashboard.html";
      const SUPABASE_URL = "https://zbihvccqizuewrnkhaho.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaWh2Y2NxaXp1ZXdybmtoYWhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzODE0ODcsImV4cCI6MjA3ODk1NzQ4N30.o5q-SZuq-3IZzL5eprub6GyFSJXTI7R6xkJ3-BpDceY";

      const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

      (async function guard() {
        // 1. CHECK LOGIN SESSION
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        if (!session) {
          window.location.replace(AUTH_URL);
          return;
        }

        const {
          data: { user },
        } = await supabaseClient.auth.getUser();

        // 2. CHECK FOR VALID, UNEXPIRED KEY
        // We select the expiration_timestamp to calculate remaining time
        const { data: activeKeys, error } = await supabaseClient
          .from("keys")
          .select("expiration_timestamp")
          .eq("activated_by_user_id", user.id)
          .gt("expiration_timestamp", new Date().toISOString()) // Must be in the future
          .order("expiration_timestamp", { ascending: false }) // Get the latest one
          .limit(1);

        // 3. IF NO VALID KEY, REDIRECT TO DASHBOARD
        if (!activeKeys || activeKeys.length === 0) {
          // Key is missing or expired
          window.location.replace(DASHBOARD_URL);
          return;
        }

        // 4. SET REAL-TIME EXPIRATION TIMER
        // This ensures if the key expires WHILE they are using the tool, they get kicked out.
        const expireDate = new Date(activeKeys[0].expiration_timestamp);
        const now = new Date();
        const timeUntilExpiry = expireDate.getTime() - now.getTime();

        console.log(
          `Key is valid. Time remaining: ${Math.floor(
            timeUntilExpiry / 1000
          )} seconds.`
        );

        // Determine if we should set a timeout (Max timeout in JS is ~24 days)
        if (timeUntilExpiry > 0 && timeUntilExpiry < 2147483647) {
          setTimeout(() => {
            alert("Your license key has expired.");
            window.location.replace(DASHBOARD_URL);
          }, timeUntilExpiry);
        }

        // If code reaches here, user is allowed.
        // You can remove the 'loading' overlay here if you have one.
      })();
    </script>
  </head>
  <body>
    <!-- YOUR TOOL CONTENT GOES HERE -->
    <div class="container">

      <p>Your license key is active.</p>
      <div class="status">● Connected</div>

      <button id="logout-btn">Logout</button>
    </div>

    <script>
      // Logout Logic
      document
        .getElementById("logout-btn")
        .addEventListener("click", async () => {
          await supabaseClient.auth.signOut();
          window.location.href = AUTH_URL;
        });
    </script>
  </body>
