<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation Test</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f2f5;
      }

      .test-button {
        padding: 15px 30px;
        font-size: 18px;
        font-weight: 600;
        color: #fff;
        background-color: #fe2c55;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .test-button:hover {
        transform: scale(1.05);
      }

      /* --- Success Popup Styles --- */
      .success-popup {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        /* Hidden by default */
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .success-popup.show {
        /* Make it visible */
        opacity: 1;
        visibility: visible;
      }

      .popup-content {
        background-color: #fff;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        /* Pop-in animation */
        transform: scale(0.8);
        transition: transform 0.3s ease;
      }

      .success-popup.show .popup-content {
        transform: scale(1);
      }

      .popup-content h2 {
        margin: 0 0 15px 0;
        color: #28a745;
        font-size: 24px;
      }

      .popup-content img {
        max-width: 250px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <button class="test-button" id="test-button">Test Success Animation</button>

    <!-- The Hidden Popup HTML -->
    <div class="success-popup" id="success-popup">
      <div class="popup-content">
        <h2>Activation Successful!</h2>
        <img
          src="https://media.tenor.com/WT3I1cagP3IAAAAC/happy-happy-happy-cat.gif"
          alt="Happy Cat Meme"
        />
      </div>
    </div>

    <!-- The Hidden Audio HTML -->
    <audio
      id="success-sound"
      src="https://cdn.pixabay.com/audio/2022/03/15/audio_242d31f262.mp3"
      preload="auto"
    ></audio>

    <script>
      const testButton = document.getElementById("test-button");
      const successPopup = document.getElementById("success-popup");
      const successSound = document.getElementById("success-sound");

      testButton.addEventListener("click", () => {
        // Show the popup
        successPopup.classList.add("show");

        // Play the sound
        // .play() can sometimes be blocked by the browser, but user interaction (a click) makes it reliable.
        successSound.play();

        // Optional: Hide the popup after a few seconds
        setTimeout(() => {
          successPopup.classList.remove("show");
        }, 3000); // Hides after 3 seconds
      });
    </script>
  </body>
</html>
