<!DOCTYPE html>
<html>
  <head>
    <title>Icon Preview</title>
    <style>
      body {
        font-family: sans-serif;
      }
      .icon-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
      }
      .icon-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 8px;
      }
      .icon-item img {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Extracted Icons</h1>

    <div class="icon-container">
      <div class="icon-item">
        <img
          src="https://sf16-sg.tiktokcdn.com/obj/eden-sg/ulfbnueh7nuvyauhbs/pwa-icons/512x512.png"
          alt="Icon 512x512"
          width="512"
          height="512"
        />
        <span>512x512</span>
      </div>
      <div class="icon-item">
        <img
          src="https://sf16-sg.tiktokcdn.com/obj/eden-sg/ulfbnueh7nuvyauhbs/pwa-icons/256x256.png"
          alt="Icon 256x256"
          width="256"
          height="256"
        />
        <span>256x256</span>
      </div>
      <div class="icon-item">
        <img
          src="https://sf16-sg.tiktokcdn.com/obj/eden-sg/ulfbnueh7nuvyauhbs/pwa-icons/192x192.png"
          alt="Icon 192x192"
          width="192"
          height="192"
        />
        <span>192x192</span>
      </div>
      <div class="icon-item">
        <img
          src="https://sf16-sg.tiktokcdn.com/obj/eden-sg/ulfbnueh7nuvyauhbs/pwa-icons/128x128.png"
          alt="Icon 128x128"
          width="128"
          height="128"
        />
        <span>128x128</span>
      </div>
    </div>
  </body>
</html>
