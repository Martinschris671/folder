<!DOCTYPE html>
<html>
  <head>
    <title>Recreated Element</title>
    <style>
      :root {
        --TextQuaternary: rgba(0, 0, 0, 0.32);
        --ui-image-overlay-white: #fff;
        --ui-shape-neutral-4: #ccc;
        --ui-shape-primary: #fe2c55;
        --ui-shape-neutral-2: rgba(0, 0, 0, 0.17);
        --ui-text-1: #000;
        --tux-web-font-body: TikTokFont, system-ui, -apple-system, Segoe UI,
          Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif, Apple Color Emoji,
          Segoe UI Emoji, Segoe UI Symbol, Noto Color Emoji;
      }

      .text-color-TextQuaternary {
        color: rgba(0, 0, 0, 0.32);
        color: var(--TextQuaternary);
      }

      .pt-2 {
        padding-top: 2px;
      }

      .flex {
        display: flex;
      }

      .items-top {
        align-items: flex-start;
      }

      .TUXRadio,
      .TUXRadio-labelContainer {
        align-items: flex-start;
        display: flex;
      }

      .TUXRadio[data-size="small"] {
        /* Styles for small radio button would go here if needed */
      }

      .TUXRadio[data-disabled="false"] {
        /* Styles for enabled radio button */
      }

      .TUXRadio[data-label-position="after"] .TUXRadio-labelContainer {
        margin-left: 8px;
      }

      .TUXRadioStandalone {
        border-radius: 999px;
        display: inline-flex;
        flex-shrink: 0;
        height: 16px;
        position: relative;
        width: 16px;
      }

      .TUXRadioStandalone--small {
        /* Styles for small standalone radio */
      }

      .TUXRadioStandalone--checked {
        /* Styles for checked standalone radio */
      }

      .TUXRadioStandalone-input {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        border-radius: 50%;
        cursor: pointer;
        height: 100%;
        margin: 0;
        width: 100%;
        border: 0;
        font-family: inherit;
        -webkit-user-select: initial;
        -moz-user-select: auto;
        user-select: auto;
      }

      * {
        box-sizing: border-box;
      }

      .TUXRadioStandalone-circleOutside {
        color: rgba(0, 0, 0, 0.17);
        color: var(--ui-shape-neutral-2);
        height: 100%;
        pointer-events: none;
        position: absolute;
        width: 100%;
      }

      .TUXRadioStandalone-input:checked ~ .TUXRadioStandalone-circleOutside {
        color: #fe2c55;
        color: var(--ui-shape-primary);
      }

      .TUXRadioStandalone-circleInside {
        color: #fe2c55;
        color: var(--ui-shape-primary);
        height: 100%;
        pointer-events: none;
        position: absolute;
        visibility: hidden;
        width: 100%;
      }

      .TUXRadioStandalone-input:checked ~ .TUXRadioStandalone-circleInside {
        visibility: visible;
      }

      .TUXRadioStandalone-circleDisabled {
        height: 100%;
        pointer-events: none;
        position: absolute;
        visibility: hidden;
        width: 100%;
      }

      .TUXRadioStandalone-input:disabled ~ .TUXRadioStandalone-circleDisabled {
        visibility: visible;
      }

      .TUXRadio-labelContainer {
        flex: 1 1;
        flex-direction: column;
        font-family: var(--tux-web-font-body);
        font-weight: 400;
        line-height: 1.3;
        word-wrap: break-word;
      }

      .TUXRadio[data-size="small"] .TUXRadio-labelContainer {
        padding-top: 0;
      }

      .radio-button-ZBSgUp .TUXRadio-labelContainer {
        display: none;
      }

      .TUXRadio-label {
        color: #000;
        color: var(--ui-text-1);
        cursor: pointer;
        display: flex;
      }

      .TUXRadio[data-size="small"] .TUXRadio-label {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div
      class="text-color-TextQuaternary flex items-top pt-2"
      data-e2e="payment-method-radio-button"
    >
      <div
        class="TUXRadio radio-button-ZBSgUp"
        data-size="small"
        data-disabled="false"
        data-label-position="after"
      >
        <div
          class="TUXRadioStandalone TUXRadioStandalone--small TUXRadioStandalone--checked"
        >
          <input
            type="radio"
            class="TUXRadioStandalone-input"
            id=":r10:"
            value=""
            checked
          />
          <svg viewBox="0 0 16 16" class="TUXRadioStandalone-circleOutside">
            <circle
              cx="8"
              cy="8"
              r="7.25"
              stroke="currentColor"
              fill="transparent"
              stroke-width="1.5"
            ></circle>
          </svg>
          <svg viewBox="0 0 16 16" class="TUXRadioStandalone-circleInside">
            <circle
              cx="8"
              cy="8"
              r="4.75"
              stroke="currentColor"
              fill="var(--ui-image-overlay-white)"
              stroke-width="3.6"
            ></circle>
          </svg>
          <svg viewBox="0 0 16 16" class="TUXRadioStandalone-circleDisabled">
            <circle
              cx="8"
              cy="8"
              r="6.5"
              stroke="currentColor"
              fill="var(--ui-shape-neutral-4)"
              stroke-width="0"
            ></circle>
          </svg>
        </div>
        <div class="TUXRadio-labelContainer">
          <label class="TUXRadio-label" for=":r10:"></label>
        </div>
      </div>
    </div>
  </body>
</html>
