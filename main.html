    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const coinInput = document.getElementById("coin-input");
        const priceDisplay = document.getElementById("price-display");
        const totalPriceDisplay = document.getElementById("total-price");
        const numKeys = document.querySelectorAll(".num-key");
        const backspaceKey = document.getElementById("backspace-key");
        const closeMainComponentButton = document.getElementById(
          "close-main-component"
        );
        const mainMask = document.getElementById("main-mask");
        const mainSheet = document.getElementById("main-sheet");

        const numberOfCoinsTrigger = document.getElementById(
          "number-of-coins-trigger"
        );
        const secondaryComponent = document.getElementById(
          "secondary-component"
        );
        const secondarySheet = document.getElementById("secondary-sheet");
        const cancelSecondaryButton =
          document.getElementById("cancel-secondary");
        const secondaryMask = document.getElementById("secondary-mask");

        const COIN_PRICE = 16.7599;

        const updatePrice = () => {
          const coinValue = parseInt(coinInput.value.replace(/,/g, "")) || 0;
          const calculatedPrice = (coinValue * COIN_PRICE).toLocaleString(
            "en-US",
            { style: "currency", currency: "NGN" }
          );
          priceDisplay.textContent = calculatedPrice;
          totalPriceDisplay.textContent = calculatedPrice;
        };

        const formatNumber = (numStr) => {
          if (!numStr) return "";
          return parseInt(numStr.replace(/,/g, "")).toLocaleString("en-US");
        };

        numKeys.forEach((key) => {
          key.addEventListener("click", () => {
            let currentValue = coinInput.value.replace(/,/g, "");
            currentValue += key.textContent;
            if (currentValue.length > 9) {
              currentValue = currentValue.substring(0, 9);
            }
            coinInput.value = formatNumber(currentValue);
            updatePrice();
          });
        });

        backspaceKey.addEventListener("click", () => {
          let currentValue = coinInput.value.replace(/,/g, "");
          currentValue = currentValue.slice(0, -1);
          coinInput.value = formatNumber(currentValue);
          updatePrice();
        });

        closeMainComponentButton.addEventListener("click", () => {
          mainSheet.classList.add("main-sheet-hidden");
          mainMask.classList.add("_9f4d_mask-hidden");
        });

        mainMask.addEventListener("click", () => {
          mainSheet.classList.add("main-sheet-hidden");
          mainMask.classList.add("_9f4d_mask-hidden");
        });

        numberOfCoinsTrigger.addEventListener("click", () => {
          secondaryComponent.classList.remove("secondary-sheet-hidden");
          secondarySheet.style.transform = "translateY(0px)";
        });

        cancelSecondaryButton.addEventListener("click", () => {
          secondarySheet.style.transform = "translateY(100%)";
          setTimeout(() => {
            secondaryComponent.classList.add("secondary-sheet-hidden");
          }, 300);
        });

        secondaryMask.addEventListener("click", () => {
          secondarySheet.style.transform = "translateY(100%)";
          setTimeout(() => {
            secondaryComponent.classList.add("secondary-sheet-hidden");
          }, 300);
        });

        // Initial state
        updatePrice();
      });
    </script>
