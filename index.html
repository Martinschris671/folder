<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Login | TikTok Coin Tool</title>
    <link
      rel="icon"
      href="https://sf16-sg.tiktokcdn.com/obj/eden-sg/ulfbnueh7nuvyauhbs/pwa-icons/128x128.png"
      sizes="128x128"
    />

    <!-- Larger icons for modern browsers and devices -->
    <link
      rel="icon"
      href="https://sf16-sg.tiktokcdn.com/obj/eden-sg/ulfbnueh7nuvyauhbs/pwa-icons/192x192.png"
      sizes="192x192"
    />
    <link
      rel="icon"
      href="https://sf16-sg.tiktokcdn.com/obj/eden-sg/ulfbnueh7nuvyauhbs/pwa-icons/256x256.png"
      sizes="256x256"
    />
    <link
      rel="icon"
      href="https://sf16-sg.tiktokcdn.com/obj/eden-sg/ulfbnueh7nuvyauhbs/pwa-icons/512x512.png"
      sizes="512x512"
    />

    <!-- Apple touch icon for iOS home screens -->
    <link
      rel="apple-touch-icon"
      href="https://sf16-sg.tiktokcdn.com/obj/eden-sg/ulfbnueh7nuvyauhbs/pwa-icons/192x192.png"
    />
    <style>
      :root {
        --primary-color: #fe2c55;
        --primary-hover-color: #e42a4f;
        --text-color: #161823;
        --background-color: #f8f8f8;
        --container-background: #ffffff;
        --border-color: #e0e0e0;
        --input-background: #f9f9f9;
        --success-color: #28a745;
        --error-color: #dc3545;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: var(--background-color);
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }
      .activation-container {
        max-width: 400px;
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
      }
      .activation-box {
        background-color: var(--container-background);
        padding: clamp(30px, 5vh, 40px);
        border-radius: 8px;
        text-align: center;
        border: 1px solid var(--border-color);
        width: 100%;
        box-sizing: border-box;
      }
      /* --- Bigger Trademark Styling at Top --- */
      .trademark {
        font-size: clamp(20px, 3.5vw, 24px);
        font-weight: 800;
        color: var(--text-color);
        margin-top: 0;
        margin-bottom: 24px;
        text-align: center;
      }
      h1 {
        font-size: clamp(24px, 4vw, 28px);
        font-weight: 700;
        margin-top: 0;
        margin-bottom: 12px;
        color: var(--text-color);
      }
      .subtitle {
        font-size: clamp(14px, 2.5vw, 16px);
        color: #6b6b6b;
        margin-bottom: clamp(24px, 5vh, 32px);
      }
      .input-group {
        margin-bottom: 16px;
        position: relative;
      }
      .input-group input[type="email"],
      .input-group input[type="password"],
      .input-group input[type="text"] {
        width: 100%;
        padding: 14px;
        padding-right: 45px;
        border: 1px solid #dcdfe6;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
        background-color: var(--input-background);
        text-align: left;
      }
      .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #6b6b6b;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .toggle-password:hover {
        color: var(--text-color);
      }
      /* --- Added Remember Me Styling --- */
      .checkbox-group {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        text-align: left;
      }
      .checkbox-group input {
        margin-right: 8px;
        width: 16px;
        height: 16px;
        cursor: pointer;
      }
      .checkbox-group label {
        font-size: 14px;
        color: var(--text-color);
        cursor: pointer;
        user-select: none;
      }
      .activate-btn {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        border: none;
        border-radius: 4px;
        background-color: var(--primary-color);
        color: var(--container-background);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s ease-in-out;
      }
      .activate-btn:hover {
        background-color: var(--primary-hover-color);
      }
      .activate-btn:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      .contact-text {
        font-size: 14px;
        color: var(--text-color);
        margin: 0;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border-color);
      }
      .contact-text a {
        color: var(--primary-color);
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .contact-text a:hover {
        text-decoration: underline;
      }
      .message-box {
        min-height: 20px;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 15px;
        color: var(--error-color);
        text-align: center;
      }
      .message-box.success {
        color: var(--success-color);
      }
      .footer-info {
        margin-top: 24px;
        font-size: 14px;
        color: #888;
        text-align: center;
      }
      .footer-info p {
        margin: 6px 0;
      }
      .footer-info a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
      }
      .footer-info a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        body {
          background-color: var(--container-background);
        }
        .activation-container {
          padding: 0;
          height: 100%;
          width: 100%;
        }
        .activation-box {
          height: 100%;
          width: 100%;
          border-radius: 0;
          border: none;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .contact-text {
          border-top: none;
          padding-top: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="activation-container">
      <div class="activation-box">
        <!-- Trademark Text Moved to the Very Top & Scaled to Match -->
        <div class="trademark">TikTok Coin Panel &trade; by iVcloned</div>

        <!-- Login View -->
        <div id="login-view">
          <h1>Login</h1>
          <p class="subtitle">Enter your credentials to access the tool.</p>
          <form id="login-form">
            <div class="message-box" id="login-message-box"></div>
            <div class="input-group">
              <input
                type="email"
                id="login-email"
                placeholder="Email"
                required
              />
            </div>
            <div class="input-group">
              <input
                type="password"
                id="login-password"
                placeholder="Password"
                required
              />
              <span
                class="toggle-password"
                onclick="togglePassword('login-password', this)"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </span>
            </div>
            <!-- Remember Me Checkbox -->
            <div class="checkbox-group">
              <input type="checkbox" id="remember-me" />
              <label for="remember-me">Remember me</label>
            </div>
            <button type="submit" class="activate-btn">Login</button>
          </form>
          <p class="contact-text">
            No account? <a id="show-register-view">Register here</a>
          </p>
        </div>

        <!-- Registration View -->
        <div id="register-view" style="display: none">
          <h1>Create Account</h1>
          <p class="subtitle">Create an account to get started.</p>
          <form id="register-form">
            <div class="message-box" id="register-message-box"></div>
            <div class="input-group">
              <input
                type="email"
                id="register-email"
                placeholder="Email"
                required
              />
            </div>
            <div class="input-group">
              <input
                type="password"
                id="register-password"
                placeholder="Password (min. 8 characters)"
                required
              />
              <span
                class="toggle-password"
                onclick="togglePassword('register-password', this)"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </span>
            </div>
            <!-- Remember Me Checkbox Added to Register Form -->
            <div class="checkbox-group">
              <input type="checkbox" id="register-remember-me" />
              <label for="register-remember-me">Remember me</label>
            </div>
            <button type="submit" class="activate-btn">Create Account</button>
          </form>
          <p class="contact-text">
            Already have an account? <a id="show-login-view">Login here</a>
          </p>
        </div>

        <div class="footer-info">
          <p>
            Contact Telegram:
            <a href="https://t.me/iv_cloned" target="_blank">@iv_cloned</a>
          </p>
        </div>
      </div>
    </div>

    <!-- Load the Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // --- ALL SCRIPT LOGIC IS SELF-CONTAINED HERE ---

      const DASHBOARD_URL = "dashboard.html";
      const SUPABASE_URL = "https://zbihvccqizuewrnkhaho.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaWh2Y2NxaXp1ZXdybmtoYWhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzODE0ODcsImV4cCI6MjA3ODk1NzQ4N30.o5q-SZuq-3IZzL5eprub6GyFSJXTI7R6xkJ3-BpDceY";

      // --- Initialize Supabase Client ---
      const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      // --- DOM Elements ---
      const loginView = document.getElementById("login-view");
      const registerView = document.getElementById("register-view");
      const loginForm = document.getElementById("login-form");
      const registerForm = document.getElementById("register-form");
      const showRegisterLink = document.getElementById("show-register-view");
      const showLoginLink = document.getElementById("show-login-view");
      const rememberMeCheckbox = document.getElementById("remember-me");
      const loginEmailInput = document.getElementById("login-email");
      const loginPasswordInput = document.getElementById("login-password");
      const registerRememberMeCheckbox = document.getElementById(
        "register-remember-me",
      );

      // --- ON LOAD: Check Local Storage for Remember Me ---
      window.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("tt_remember") === "true") {
          const savedEmail = localStorage.getItem("tt_email") || "";
          const savedPass = localStorage.getItem("tt_password") || "";

          loginEmailInput.value = savedEmail;
          loginPasswordInput.value = savedPass;
          rememberMeCheckbox.checked = true;

          // Pre-fill Register form as well
          document.getElementById("register-email").value = savedEmail;
          document.getElementById("register-password").value = savedPass;
          registerRememberMeCheckbox.checked = true;
        }
      });

      // --- HELPER FUNCTIONS ---
      function togglePassword(inputId, iconElement) {
        const input = document.getElementById(inputId);
        const eyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const eyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        if (input.type === "password") {
          input.type = "text";
          iconElement.innerHTML = eyeClosed;
        } else {
          input.type = "password";
          iconElement.innerHTML = eyeOpen;
        }
      }

      function switchView(viewName) {
        if (viewName === "register") {
          loginView.style.display = "none";
          registerView.style.display = "block";
        } else {
          registerView.style.display = "none";
          loginView.style.display = "block";
        }
      }

      function displayMessage(view, message, type = "error") {
        const box = document.getElementById(`${view}-message-box`);
        box.textContent = message;
        box.className = `message-box ${type}`;
      }

      function setLoadingState(form, isLoading) {
        const button = form.querySelector("button");
        button.disabled = isLoading;
        button.textContent = isLoading
          ? "Verifying..."
          : form.id === "login-form"
            ? "Login"
            : "Create Account";
      }

      // --- EVENT LISTENERS ---

      // Listener to switch to the registration form
      showRegisterLink.addEventListener("click", (e) => {
        e.preventDefault();
        switchView("register");
      });

      // Listener to switch back to the login form
      showLoginLink.addEventListener("click", (e) => {
        e.preventDefault();
        switchView("login");
      });

      // Listener for the registration form submission
      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("register-email").value;
        const password = document.getElementById("register-password").value;

        setLoadingState(registerForm, true);
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
        });

        if (error) {
          displayMessage("register", error.message);
          setLoadingState(registerForm, false);
        } else {
          // Display success message and delay redirect
          displayMessage(
            "register",
            "Account created successfully! Redirecting...",
            "success",
          );

          // Handle Register Remember Me save
          if (registerRememberMeCheckbox.checked) {
            localStorage.setItem("tt_remember", "true");
            localStorage.setItem("tt_email", email);
            localStorage.setItem("tt_password", password);
          } else {
            localStorage.removeItem("tt_remember");
            localStorage.removeItem("tt_email");
            localStorage.removeItem("tt_password");
          }

          setTimeout(() => {
            window.location.href = DASHBOARD_URL;
          }, 1500);
        }
      });

      // Listener for the login form submission
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = loginEmailInput.value;
        const password = loginPasswordInput.value;

        setLoadingState(loginForm, true);
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          displayMessage("login", error.message);
          setLoadingState(loginForm, false);
        } else {
          // Display success message and delay redirect
          displayMessage(
            "login",
            "Login successful! Redirecting...",
            "success",
          );

          // Handle Remember Me credentials saving
          if (rememberMeCheckbox.checked) {
            localStorage.setItem("tt_remember", "true");
            localStorage.setItem("tt_email", email);
            localStorage.setItem("tt_password", password);
          } else {
            localStorage.removeItem("tt_remember");
            localStorage.removeItem("tt_email");
            localStorage.removeItem("tt_password");
          }

          setTimeout(() => {
            window.location.href = DASHBOARD_URL;
          }, 1500);
        }
      });
    </script>
  </body>
</html>
