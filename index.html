<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Login | TikTok Coin Tool</title>
    <style>
      :root {
        --primary-color: #fe2c55;
        --primary-hover-color: #e42a4f;
        --text-color: #161823;
        --background-color: #f8f8f8;
        --container-background: #ffffff;
        --border-color: #e0e0e0;
        --input-background: #f9f9f9;
        --success-color: #28a745;
        --error-color: #dc3545;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: var(--background-color);
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }
      .activation-container {
        max-width: 400px;
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
      }
      .activation-box {
        background-color: var(--container-background);
        padding: clamp(30px, 5vh, 40px);
        border-radius: 8px;
        text-align: center;
        border: 1px solid var(--border-color);
        width: 100%;
        box-sizing: border-box;
      }
      h1 {
        font-size: clamp(24px, 4vw, 28px);
        font-weight: 700;
        margin-top: 0;
        margin-bottom: 12px;
        color: var(--text-color);
      }
      .subtitle {
        font-size: clamp(14px, 2.5vw, 16px);
        color: #6b6b6b;
        margin-bottom: clamp(24px, 5vh, 32px);
      }
      .input-group {
        margin-bottom: 16px;
      }
      .input-group input {
        width: 100%;
        padding: 14px;
        border: 1px solid #dcdfe6;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
        background-color: var(--input-background);
        text-align: left;
      }
      .activate-btn {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        border: none;
        border-radius: 4px;
        background-color: var(--primary-color);
        color: var(--container-background);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s ease-in-out;
      }
      .activate-btn:hover {
        background-color: var(--primary-hover-color);
      }
      .activate-btn:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      .contact-text {
        font-size: 14px;
        color: var(--text-color);
        margin: 0;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border-color);
      }
      .contact-text a {
        color: var(--primary-color);
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .contact-text a:hover {
        text-decoration: underline;
      }
      .message-box {
        min-height: 20px;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 15px;
        color: var(--error-color);
        text-align: center;
      }
      .message-box.success {
        color: var(--success-color);
      }
      @media (max-width: 480px) {
        body {
          background-color: var(--container-background);
        }
        .activation-container {
          padding: 0;
          height: 100%;
          width: 100%;
        }
        .activation-box {
          height: 100%;
          width: 100%;
          border-radius: 0;
          border: none;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .contact-text {
          border-top: none;
          padding-top: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="activation-container">
      <div class="activation-box">
        <!-- Login View -->
        <div id="login-view">
          <h1>Login</h1>
          <p class="subtitle">Enter your credentials to access the tool.</p>
          <form id="login-form">
            <div class="message-box" id="login-message-box"></div>
            <div class="input-group">
              <input
                type="email"
                id="login-email"
                placeholder="Email"
                required
              />
            </div>
            <div class="input-group">
              <input
                type="password"
                id="login-password"
                placeholder="Password"
                required
              />
            </div>
            <button type="submit" class="activate-btn">Login</button>
          </form>
          <p class="contact-text">
            No account? <a id="show-register-view">Register here</a>
          </p>
        </div>
        <!-- Registration View -->
        <div id="register-view" style="display: none">
          <h1>Create Account</h1>
          <p class="subtitle">Create an account to get started.</p>
          <form id="register-form">
            <div class="message-box" id="register-message-box"></div>
            <div class="input-group">
              <input
                type="email"
                id="register-email"
                placeholder="Email"
                required
              />
            </div>
            <div class="input-group">
              <input
                type="password"
                id="register-password"
                placeholder="Password (min. 8 characters)"
                required
              />
            </div>
            <button type="submit" class="activate-btn">Create Account</button>
          </form>
          <p class="contact-text">
            Already have an account? <a id="show-login-view">Login here</a>
          </p>
        </div>
      </div>
    </div>

    <!-- Load the Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // --- ALL SCRIPT LOGIC IS SELF-CONTAINED HERE ---

      const DASHBOARD_URL = "dashboard.html";
      const SUPABASE_URL = "https://zbihvccqizuewrnkhaho.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaWh2Y2NxaXp1ZXdybmtoYWhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzODE0ODcsImV4cCI6MjA3ODk1NzQ4N30.o5q-SZuq-3IZzL5eprub6GyFSJXTI7R6xkJ3-BpDceY";

      // --- Initialize Supabase Client ---
      const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

      // --- DOM Elements ---
      const loginView = document.getElementById("login-view");
      const registerView = document.getElementById("register-view");
      const loginForm = document.getElementById("login-form");
      const registerForm = document.getElementById("register-form");
      const showRegisterLink = document.getElementById("show-register-view");
      const showLoginLink = document.getElementById("show-login-view");

      // --- HELPER FUNCTIONS ---
      function switchView(viewName) {
        if (viewName === "register") {
          loginView.style.display = "none";
          registerView.style.display = "block";
        } else {
          registerView.style.display = "none";
          loginView.style.display = "block";
        }
      }

      function displayMessage(view, message, type = "error") {
        const box = document.getElementById(`${view}-message-box`);
        box.textContent = message;
        box.className = `message-box ${type}`;
      }

      function setLoadingState(form, isLoading) {
        const button = form.querySelector("button");
        button.disabled = isLoading;
        button.textContent = isLoading
          ? "Verifying..."
          : form.id === "login-form"
          ? "Login"
          : "Create Account";
      }

      // --- EVENT LISTENERS ---

      // Listener to switch to the registration form
      showRegisterLink.addEventListener("click", (e) => {
        e.preventDefault();
        switchView("register");
      });

      // Listener to switch back to the login form
      showLoginLink.addEventListener("click", (e) => {
        e.preventDefault();
        switchView("login");
      });

      // Listener for the registration form submission
      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("register-email").value;
        const password = document.getElementById("register-password").value;

        setLoadingState(registerForm, true);
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
        });

        if (error) {
          displayMessage("register", error.message);
        } else {
          displayMessage("register", "Success! You can now log in.", "success");
          registerForm.reset();
        }
        setLoadingState(registerForm, false);
      });

      // Listener for the login form submission
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        setLoadingState(loginForm, true);
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          displayMessage("login", error.message);
        } else {
          window.location.href = DASHBOARD_URL;
        }
        setLoadingState(loginForm, false);
      });
    </script>
  </body>
</html>
